# Keeps the GitHub Actions versions and the uv.lock Python packages current (weekly, one grouped pull request each).
# Every bump is a normal pull request, reviewed by the owner like any other change, and runs the full CI.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
